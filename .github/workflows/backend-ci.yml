name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          # 演示依赖 + 导入器依赖(pandas):test_ingest.py 需要后者
          python -m pip install -r requirements.lock -r requirements-ingest.lock
          python -m pip install -e . --no-deps

      - name: Check critical Python errors
        run: python -m ruff check app tests --select E9,F63,F7,F82

      - name: Run tests
        run: python -m pytest -q
