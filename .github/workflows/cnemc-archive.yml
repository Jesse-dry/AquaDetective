name: CNEMC 前向存档

# 每 4 小时 +17 分拉取一次国家地表水实时数据(官方约 00/04/08/12/16/20 点出数)
# 注意:GitHub Actions cron 为 UTC;每 4h 一轮的频率下时区只影响绝对时刻,不影响每日 6 轮覆盖
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch: # 支持手动触发

# 防止上一轮未跑完时并发重入
concurrency:
  group: cnemc-archive
  cancel-in-progress: false

permissions:
  contents: write # 回写去重长表到仓库

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 脚本仅依赖标准库,无需 pip install
      - name: 拉取并存档 CNEMC 实时水质
        run: |
          set -x
          python tools/cnemc_archive.py
          echo "=== 产物清单 ==="
          ls -la data/raw/cnemc_surface_water_realtime/archive/ || echo "archive 目录缺失"
          ls -la data/interim/cnemc_archive/ || echo "interim 目录缺失"

      # 原始快照体积大且 gitignored,作为构件留存 30 天
      - name: 上传原始快照构件
        uses: actions/upload-artifact@v4
        with:
          name: cnemc-snapshot-${{ github.run_id }}
          path: data/raw/cnemc_surface_water_realtime/archive/*
          retention-days: 30
          if-no-files-found: warn

      # 去重长表回写仓库(有变更才提交)
      - name: 回写去重长表
        run: |
          set -x
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/interim/cnemc_archive/all_stations.csv
          if git diff --cached --quiet; then
            echo "无新增记录(全部为已存档时次),跳过提交"
          else
            git commit -m "data: CNEMC 定时存档 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
