name: CNEMC 前向存档

# 每 4 小时 +13 分拉取一次国家地表水实时数据(官方约 00/04/08/12/16/20 点出数)
# 注意:GitHub Actions cron 为 UTC;每 4h 一轮的频率下时区只影响绝对时刻,不影响每日 6 轮覆盖
# 本工作流为异地冗余备份;主力轨为本地中国 IP cron(见 tools/cnemc_archive.py docstring)
on:
  schedule:
    - cron: '43 */4 * * *'  # 北京 00:43/04:43/...,给 CNEMC ~43 分钟发布时间
  workflow_dispatch: # 支持手动触发

# 防止上一轮未跑完时并发重入
concurrency:
  group: cnemc-archive
  cancel-in-progress: false

permissions:
  contents: write # 回写去重长表到仓库
  issues: write   # 失败时自动建 issue 告警(显式声明后未列 scope 默认 none)

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # 单页3次重试最坏~210s,多页半挂需裕量
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史,rebase 冲突时能正确重构提交链

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 脚本仅依赖标准库,无需 pip install
      # 健康检查(行数>0 且覆盖率>90% 且时次新鲜)不达标则 sys.exit(1),杜绝静默假成功
      - name: 拉取并存档 CNEMC 实时水质
        run: python tools/cnemc_archive.py

      # 原始快照体积大且 gitignored,作为构件留存 30 天
      - name: 上传原始快照构件
        uses: actions/upload-artifact@v4
        with:
          name: cnemc-snapshot-${{ github.run_id }}
          path: data/raw/cnemc_surface_water_realtime/archive/*
          retention-days: 30
          if-no-files-found: error  # 快照应存在,无文件说明脚本异常,应 fail

      # 去重长表回写仓库(有变更才提交;push 重试+rebase,显式状态校验防静默成功)
      - name: 回写去重长表
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/interim/cnemc_archive/all_stations.csv
          if git diff --cached --quiet; then
            echo "无新增记录(全部为已存档时次),跳过提交"
          else
            git commit -m "data: CNEMC 定时存档 $(date -u +%Y-%m-%dT%H:%MZ)"
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then
                pushed=1; break
              else
                echo "push 第 $i 次失败,abort rebase 后重试"
                git rebase --abort 2>/dev/null || true
                sleep 5
              fi
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::push 3 次重试均失败,本次存档数据未入库(已 commit 在 runner 本地,runner 销毁后丢失)"
              exit 1
            fi
          fi

      # 失败通知(去重:已有 open issue 则评论,不新建,避免高频刷 issue)
      - name: 失败告警
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            // 查找已存在的 cnemc-archive open issue
            const existing = await github.rest.issues.listForRepo({
              owner, repo, labels: 'cnemc-archive', state: 'open', per_page: 1
            });
            if (existing.data.length > 0) {
              // 已有则评论(累积失败记录,不新建 issue)
              const iss = existing.data[0];
              await github.rest.issues.createComment({
                owner, repo, issue_number: iss.number,
                body: `运行 #${context.runNumber} 失败 (${new Date().toISOString().slice(0,16)}Z)\n${runUrl}`
              });
            } else {
              // 首次失败建 issue
              await github.rest.issues.create({
                owner, repo,
                title: `CNEMC 存档工作流失败`,
                body: `运行 #${context.runNumber} 失败,请查看 ${runUrl}\n\n高频存档(每4h)失败可能造成数据时序缺口,后续失败将以评论形式累积于此 issue。`,
                labels: ['cnemc-archive', 'auto-alert']
              });
            }
