[project]
name = "aqua-detective-backend"
version = "0.1.0"
description = "AquaDetective 水质预警溯源智能体 - 后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.2,<0.3",
    "numpy>=1.26",
    "scipy>=1.11",
    "networkx>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.40",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
