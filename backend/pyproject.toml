[project]
name = "aqua-detective-backend"
version = "0.1.0"
description = "AquaDetective 水质预警溯源智能体 - 后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.2,<0.3",
    "numpy>=1.26",
    "scipy>=1.11",
    "networkx>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.40",
    "httpx>=0.27",
]

[project.optional-dependencies]
# 演示与测试不需要 pandas:它只被 app/ingest/ 这个独立导入器 CLI 使用,
# 服务启动链不加载它。独立成 extra 后,演示环境不会因它的平台 wheel 问题装不上。
dev = ["pytest>=8", "ruff>=0.5", "pandas>=2.2"]
ingest = ["pandas>=2.2"]
data = ["geopandas>=1.0", "pyogrio>=0.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "tests*"]

[tool.setuptools.package-data]
"app.data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
